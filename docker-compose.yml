services:
  # Minimal Jazz sync server for this reproduction. Single-app: the server
  # only knows about the appId it was started with.
  #
  # No host volume mount on /data — the container is intentionally
  # ephemeral. `docker compose down && up` always gives a brand-new sync
  # server with zero accumulated state, which is what makes the hang
  # reproduce reliably. Use `pnpm reset` to cycle it between runs.
  jazz-server:
    build: ./docker
    container_name: jazz-renderer-hang-repro-server
    restart: unless-stopped
    ports:
      - "1626:1625"
    command:
      - "${PUBLIC_JAZZ_APP_ID:?PUBLIC_JAZZ_APP_ID required}"
      - "--port=1625"
      - "--data-dir=/data"
      - "--admin-secret=${JAZZ_ADMIN_SECRET:?JAZZ_ADMIN_SECRET required}"
